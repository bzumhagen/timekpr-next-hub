# systemd-tmpfiles config: directories the hub needs that aren't created
# by systemd-sysusers or by installing Postgres.
#
# /etc/timekpr-hub holds hub.env (DATABASE_URL, HUB_TZ, ...), readable by
# the timekpr-hub service user but not world-readable (it contains the DB
# password).
#
# /var/backups/timekpr-hub holds the one-off pre-upgrade safety dump
# install.sh takes before touching the venv -- owned by postgres since
# pg_dump runs as that user over the unix socket, so no second copy of the
# DB password is ever needed. There is no recurring backup timer; ongoing
# backups are the operator's call (see README.md).
#
# Installed by install.sh to /usr/lib/tmpfiles.d/timekpr-hub.conf, then:
#   systemd-tmpfiles --create timekpr-hub.conf
d /etc/timekpr-hub          0750 root     timekpr-hub -
d /var/backups/timekpr-hub  0750 postgres postgres    -

[project]
name = "timekpr-hub"
version = "0.1.0"
description = "FastAPI hub: centralized, pooled screen-time management for timekpr-next"
requires-python = ">=3.11"
dependencies = [
    "timekpr-hub-core",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31",
    "alembic>=1.19",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "argon2-cffi>=23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["timekpr_hub"]
# hatchling includes every file under the package directory by default (not
# just *.py), so web/templates/*.html ships inside the wheel automatically --
# verified in the plan's build step (unzip the wheel, check for the .html
# files). No force-include needed.

[tool.uv.sources]
timekpr-hub-core = { workspace = true }

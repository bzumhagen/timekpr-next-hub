[project]
name = "timekpr-hub-core"
version = "0.1.0"
description = "Pure, IO-free convergence/calendar/interval-union logic shared by the hub and the agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["timekpr_hub_core"]

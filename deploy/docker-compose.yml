# PLAN reference: "Deploy: docker-compose with hub + postgres." Run from the
# repo root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# Postgres is bound only to the docker network (no host port published) --
# the hub is the only thing that needs to reach it. The hub itself publishes
# :8000 directly -- this stack is meant for a LAN or a Tailscale/WireGuard
# tunnel; put your own reverse proxy in front of it if you want TLS.
#
# Backups are yours to arrange (see README.md) -- there's no backup service
# here.
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timekpr_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-timekpr_hub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timekpr_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  hub:
    build:
      context: ..
      dockerfile: hub/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-timekpr_hub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-timekpr_hub}
      HUB_TZ: ${HUB_TZ:-UTC}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

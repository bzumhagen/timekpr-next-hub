# systemd-tmpfiles config: the config directory for the agent.
# (StateDirectory= in the .service unit already creates
# /var/lib/timekpr-hub-agent -- where the device token and state.json
# actually live -- at service start with the right ownership; this file
# additionally covers /etc/timekpr-hub-agent, for agent.env, which
# systemd's StateDirectory directive doesn't reach.)
d /etc/timekpr-hub-agent 0750 root timekpr-hub -

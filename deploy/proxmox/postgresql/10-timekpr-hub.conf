# Tuning drop-in for a Postgres cluster serving only the timekpr-hub, on a
# small (512MB-1GB) Proxmox LXC. Installed by install.sh to
# /etc/postgresql/<ver>/main/conf.d/10-timekpr-hub.conf (requires
# `include_dir = 'conf.d'` in postgresql.conf, which Debian's package
# already sets up).
#
# Sized against the hub's own connection pool -- pool_size=5,
# max_overflow=5, one uvicorn worker (hub/timekpr_hub/db/session.py, which
# documents single-writer-against-Postgres as the intended deployment).

listen_addresses = 'localhost'          # the hub is local-only; nothing else may reach PG
password_encryption = scram-sha-256
timezone = 'UTC'                        # the app owns display tz via HUB_TZ

# Connections: 10 from the app pool (5 + 5 overflow) + 1 for the
# migration/alembic run (NullPool) + 1 for the pre-upgrade pg_dump + a
# handful of superuser-reserved + headroom for an interactive psql.
max_connections = 20
superuser_reserved_connections = 3

shared_buffers = 64MB                   # 12.5% of a 512MB box; PG's 128MB default is
                                         # greedy next to the ~130MB the hub itself wants
effective_cache_size = 192MB
work_mem = 8MB                          # ~10 backends worst case; affordable only because
                                         # concurrency is capped that low
maintenance_work_mem = 48MB             # one autovacuum/CREATE INDEX at a time
huge_pages = off                        # not available to an unprivileged LXC

# Parallel query is pure overhead on household-sized tables, and each
# worker costs another work_mem plus a /dev/shm segment (small in LXC).
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0

# JIT: LLVM adds 20-40MB RSS per backend that compiles, for queries that
# are all index lookups and small range_agg rollups. Never worth it here.
jit = off

wal_compression = on
min_wal_size = 64MB
max_wal_size = 512MB                    # the 1GB default is a lot of a small disk
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
synchronous_commit = on                 # writes are tiny; don't trade away durability

random_page_cost = 1.1                  # SSD-backed Proxmox storage

# Agents write activity_intervals every ~20s: many small INSERT/UPDATEs,
# so vacuum early and often rather than in big stalls.
autovacuum_max_workers = 2
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_insert_scale_factor = 0.05
autovacuum_work_mem = 32MB

log_min_duration_statement = 1000
log_checkpoints = off

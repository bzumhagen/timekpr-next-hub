# systemd-sysusers config: creates the service account the hub runs as.
# No supplementary groups needed -- unlike the agent, the hub never talks
# to DBUS or timekprd, only to Postgres over TCP and the network.
#
# Installed by install.sh to /usr/lib/sysusers.d/timekpr-hub.conf, then:
#   systemd-sysusers timekpr-hub.conf
u timekpr-hub - "timekpr-next-hub service" /nonexistent /usr/sbin/nologin

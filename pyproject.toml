[project]
name = "timekpr-next-hub"
version = "0.1.0"
description = "Centralized, pooled screen-time management hub for timekpr-next"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "timekpr-hub-core",
    "timekpr-hub",
    "timekpr-hub-agent",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "hypothesis>=6.168",
    "asgi-lifespan>=2.1",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.15",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "hub", "agent"]

[tool.uv.sources]
timekpr-hub-core = { workspace = true }
timekpr-hub = { workspace = true }
timekpr-hub-agent = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# All async tests share one event loop (rather than one per test function).
# Needed because timekpr_hub.db.session creates its engine/pool once at
# import time; a fresh event loop per test would hand asyncpg connections
# created under loop N to a teardown running under loop N+1.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "db: needs a reachable Postgres test database (make test-db / make test-all)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's DI pattern (`param: T = Depends(...)`) is how it recognizes a
# dependency at all, not a mutable-default footgun -- each request gets a
# fresh call. Should eventually move to `Annotated[T, Depends(...)]`.
"hub/timekpr_hub/api/*.py" = ["B008"]
# Same false positive: ConvergenceConfig() as a default is an immutable,
# cheap-to-construct dataclass used as a shared-default sentinel.
"core/timekpr_hub_core/convergence.py" = ["B008", "UP042"]
# `class Foo(str, Enum)` -> `enum.StrEnum` is a safe modernization in
# general, but str()/f"{}" formatting differs across Python versions for
# the two forms -- these are wire-format enums in the hub<->agent JSON
# contract, so this stays a deliberate decision, not an automatic fix.
"core/timekpr_hub_core/models.py" = ["UP042"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# Non-strict baseline: covers third-party libs with no stubs in general,
# and specifically timekpr/dbus (system-provided, no stubs anywhere).
ignore_missing_imports = true
mypy_path = ["core", "hub", "agent"]
# Excludes makepkg's own build staging dirs, left behind by a manual
# `makepkg -f` -- they hold a second copy of timekpr_hub_core, which mypy
# then reports as a duplicate module. Gitignored but not mypy-ignored.
exclude = ["^agent/packaging/(pkg|src)/"]

# Alembic config. Most of Alembic's generated options are omitted here
# (defaults are fine) -- see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for the full set.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Never read: hub/migrations/env.py overrides this from $DATABASE_URL,
# the same env var the app itself uses (see that module's own comment).
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

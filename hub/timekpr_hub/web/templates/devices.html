{% extends "_base.html" %}
{% block title %}Devices -- timekpr-next-hub{% endblock %}
{% block content %}
  <div class="topbar">
    <h1>Devices</h1>
    <span class="actions" style="margin:0;">
      <a class="button-link" href="/audit">Audit log</a>
      <a class="button-link" href="/">&larr; Back</a>
    </span>
  </div>

  <div class="card">
    <p class="card-title">Enrolled devices</p>
    <div id="devices" data-poll="/ui/devices-fragment" data-poll-ms="{{ poll_ms }}">
      Loading&hellip;
    </div>
  </div>

  <div class="card">
    <p class="card-title">Enroll a new device</p>
    <form data-post="/ui/enrollment-codes" data-target="#enroll-result" data-swap="innerHTML">
      <button type="submit">Generate enrollment code</button>
    </form>
    <div id="enroll-result"></div>
  </div>
{% endblock %}

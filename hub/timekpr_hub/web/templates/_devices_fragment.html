{% for d in devices %}
  <span class="device-pill {{ d.status }}{{ ' stale' if d.stale else '' }}">
    {{ d.name }} &middot; {{ d.status }} &middot; v{{ d.agent_version }}
    &middot; <span title="last successful contact from this device's agent">{{ d.last_seen }}</span>
    {% if d.stale %}<strong> (not checking in)</strong>{% endif %}
    {% if d.status == 'pending' %}
      <form style="display:inline" hx-post="/ui/devices/{{ d.id }}/approve" hx-target="#devices" hx-swap="innerHTML">
        <button type="submit" style="padding:0 .3rem;">approve</button>
      </form>
    {% endif %}
  </span>
{% else %}
  <p>No devices enrolled yet.</p>
{% endfor %}

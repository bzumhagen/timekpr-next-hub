<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>timekpr-next-hub</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 4rem auto; padding: 0 1rem; }
    h1 { font-size: 1.2rem; }
    p { font-size: .9rem; opacity: .8; }
    label { display: block; margin: .75rem 0 .25rem; font-size: .9rem; }
    input { width: 100%; padding: .5rem; border-radius: 6px; border: 1px solid #8886; box-sizing: border-box; }
    button { margin-top: 1rem; width: 100%; padding: .5rem; border-radius: 6px; border: 1px solid #8886; background: #8881; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Set up timekpr-next-hub</h1>
  <p>
    No parent account exists yet. Create the first one now -- this page
    disappears once it does, so only whoever gets here first can claim
    this hub. Do this before the hub is reachable from anywhere but your
    own network.
  </p>
  <form method="post" action="/setup">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>
    <label for="password">Password (at least 8 characters)</label>
    <input type="password" id="password" name="password" minlength="8" required>
    <button type="submit">Create account</button>
  </form>
</body>
</html>

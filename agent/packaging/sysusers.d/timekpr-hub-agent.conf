# systemd-sysusers config: creates the service account the agent runs as.
# Adding it to the `timekpr` group (created by timekpr-next's own postinst,
# gid 2000) is what grants full admin DBUS access -- see
# resource/server/dbus/timekpr.conf in the timekpr-next repo.
#
# Install to /usr/lib/sysusers.d/timekpr-hub-agent.conf, then:
#   systemd-sysusers timekpr-hub-agent.conf
u timekpr-hub - "timekpr-next-hub agent" /var/lib/timekpr-hub-agent -
m timekpr-hub timekpr

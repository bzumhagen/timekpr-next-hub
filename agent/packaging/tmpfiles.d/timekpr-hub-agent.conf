# systemd-tmpfiles config: state and config directories for the agent.
# (StateDirectory= in the .service unit also creates /var/lib/timekpr-hub-agent
# at service start with the right ownership -- this file additionally covers
# /etc/timekpr-hub-agent for the environment file and device token, which
# systemd's StateDirectory directive doesn't reach.)
d /etc/timekpr-hub-agent 0750 root timekpr-hub -
